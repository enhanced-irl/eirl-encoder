# eirl-encoder image (MODEMS.md §12): usbmuxd holds the trust an iPhone's owner gave the encoder, which reaches far
# more of the phone than its tethering. Only root may use it; none of the encoder's services needs it.
# - Its pairing records (the host's private keys) are written 0600: usbmuxd sets its folder back to 2775 itself.
# - Its socket is made root-only: usbmuxd chmods it to 0666 right after creating it (hard-coded), so this waits
#   for that 0666 and only then changes it. If the socket never shows up, the unit fails: closed, not open.
[Service]
UMask=0077
ExecStartPre=/bin/rm -f /run/usbmuxd
ExecStartPost=/bin/sh -c 'i=0; until [ "$$(stat -c %%a /run/usbmuxd 2>/dev/null)" = 666 ] || [ $$i -ge 300 ]; do sleep 0.01; i=$$((i+1)); done; chmod 0600 /run/usbmuxd'
