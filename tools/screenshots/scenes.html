<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  svg{display:block}
</style></head>
<body>
<script>
// Synthetic "camera" frames for the README screenshots: flat illustrated scenes, no photos, no people.
const q = new URLSearchParams(location.search);
const scene = q.get('scene') || 'city';
const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080);
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg');
svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
document.body.appendChild(svg);
let defs = '', body = '';
const grad = (id, stops, x2 = 0, y2 = 1) => {
  defs += `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">` +
    stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('') + '</linearGradient>';
};
const radial = (id, stops) => {
  defs += `<radialGradient id="${id}">` + stops.map(([o, c, a = 1]) =>
    `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('') + '</radialGradient>';
};
defs += `<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter><filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>`;

function city() {
  grad('sky', [[0, '#1b1f4a'], [0.45, '#6b2f6e'], [0.75, '#e0645a'], [1, '#f6b26b']]);
  radial('sun', [[0, '#fff3c4'], [0.35, '#ffd27a'], [1, '#ff9a5a', 0]]);
  body += `<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  body += `<circle cx="${W * 0.62}" cy="${H * 0.6}" r="${H * 0.28}" fill="url(#sun)"/>`;
  // far skyline
  const layer = (base, minH, maxH, col, win, step) => {
    let x = -20;
    while (x < W + 20) {
      const w = step * (0.6 + rnd() * 1.1), h = minH + rnd() * (maxH - minH);
      body += `<rect x="${x}" y="${base - h}" width="${w}" height="${h + 4}" fill="${col}"/>`;
      if (rnd() > 0.7) body += `<rect x="${x + w * 0.45}" y="${base - h - 40}" width="4" height="40" fill="${col}"/>`;
      if (win) for (let wy = base - h + 18; wy < base - 14; wy += 22)
        for (let wx = x + 10; wx < x + w - 12; wx += 18)
          if (rnd() > 0.55) body += `<rect x="${wx}" y="${wy}" width="8" height="11" fill="${rnd() > 0.3 ? '#ffd98a' : '#9fd6ff'}" opacity="${0.55 + rnd() * 0.45}"/>`;
      x += w + 2;
    }
  };
  layer(H * 0.72, H * 0.12, H * 0.32, '#3b2752', false, 90);
  layer(H * 0.76, H * 0.1, H * 0.42, '#1d1530', true, 130);
  // street
  grad('road', [[0, '#151020'], [1, '#07060c']]);
  body += `<rect y="${H * 0.76}" width="${W}" height="${H * 0.24}" fill="url(#road)"/>`;
  // light trails
  for (let i = 0; i < 9; i++) {
    const y = H * (0.8 + i * 0.02), c = i % 2 ? '#ff4d4d' : '#ffe9b0';
    body += `<path d="M -50 ${y + 30} C ${W * 0.3} ${y}, ${W * 0.7} ${y + 8}, ${W + 50} ${y - 10}" stroke="${c}" stroke-width="${3 + rnd() * 4}" fill="none" opacity="${0.5 + rnd() * 0.4}" filter="url(#blur3)"/>`;
  }
  // street lamps
  for (let i = 0; i < 6; i++) {
    const x = W * (0.08 + i * 0.17);
    body += `<rect x="${x}" y="${H * 0.6}" width="6" height="${H * 0.18}" fill="#0c0a14"/>`;
    body += `<circle cx="${x + 3}" cy="${H * 0.6}" r="26" fill="#ffd98a" opacity="0.35" filter="url(#blur8)"/><circle cx="${x + 3}" cy="${H * 0.6}" r="7" fill="#fff1c9"/>`;
  }
}

function mountain() {
  grad('sky', [[0, '#7cc4f0'], [0.6, '#cfe9f7'], [1, '#f3efe2']]);
  body += `<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  body += `<circle cx="${W * 0.78}" cy="${H * 0.2}" r="${H * 0.06}" fill="#fffbe8"/>`;
  const ridge = (base, amp, col, n) => {
    let d = `M 0 ${H} L 0 ${base}`;
    for (let i = 0; i <= n; i++) d += ` L ${(W * i) / n} ${base - rnd() * amp}`;
    body += `<path d="${d} L ${W} ${H} Z" fill="${col}"/>`;
  };
  ridge(H * 0.5, H * 0.25, '#9db7cc', 9);
  // snow caps on the far range
  ridge(H * 0.58, H * 0.2, '#6f8fa8', 12);
  ridge(H * 0.68, H * 0.14, '#4d6b5a', 16);
  ridge(H * 0.8, H * 0.1, '#2f4a3a', 22);
  // trail
  body += `<path d="M ${W * 0.42} ${H} C ${W * 0.48} ${H * 0.9}, ${W * 0.56} ${H * 0.86}, ${W * 0.55} ${H * 0.78}" stroke="#c9b48a" stroke-width="${W * 0.03}" fill="none" stroke-linecap="round" opacity="0.9"/>`;
  // pines
  for (let i = 0; i < 40; i++) {
    const x = rnd() * W, y = H * (0.82 + rnd() * 0.2), s = 30 + rnd() * 50;
    body += `<path d="M ${x} ${y - s * 2} L ${x - s * 0.55} ${y} L ${x + s * 0.55} ${y} Z" fill="#1d3326"/>`;
  }
  // a few clouds
  for (let i = 0; i < 4; i++) {
    const x = rnd() * W, y = H * (0.1 + rnd() * 0.2);
    body += `<ellipse cx="${x}" cy="${y}" rx="${120 + rnd() * 120}" ry="${26 + rnd() * 14}" fill="#ffffff" opacity="0.75" filter="url(#blur8)"/>`;
  }
}

function sea() {
  grad('sky', [[0, '#2a2f6b'], [0.5, '#c25b7a'], [1, '#ffb36b']]);
  grad('sea', [[0, '#3b3f7a'], [1, '#0d1430']]);
  radial('sun', [[0, '#fff6d8'], [0.4, '#ffcf73'], [1, '#ff8a4a', 0]]);
  body += `<rect width="${W}" height="${H * 0.6}" fill="url(#sky)"/>`;
  body += `<circle cx="${W * 0.5}" cy="${H * 0.58}" r="${H * 0.2}" fill="url(#sun)"/>`;
  body += `<rect y="${H * 0.6}" width="${W}" height="${H * 0.4}" fill="url(#sea)"/>`;
  for (let i = 0; i < 26; i++) {
    const y = H * (0.61 + i * 0.015), w = W * (0.04 + rnd() * 0.12) * (1 + i * 0.05);
    body += `<rect x="${W * 0.5 - w / 2 + (rnd() - 0.5) * 40}" y="${y}" width="${w}" height="${3 + i * 0.25}" rx="2" fill="#ffd28a" opacity="${0.75 - i * 0.02}"/>`;
  }
  // pier
  body += `<rect x="${W * 0.06}" y="${H * 0.63}" width="${W * 0.3}" height="10" fill="#120d1c"/>`;
  for (let i = 0; i < 9; i++) body += `<rect x="${W * 0.07 + i * W * 0.035}" y="${H * 0.63}" width="8" height="${H * 0.08}" fill="#120d1c"/>`;
  // birds
  for (let i = 0; i < 5; i++) {
    const x = W * (0.62 + rnd() * 0.25), y = H * (0.18 + rnd() * 0.15);
    body += `<path d="M ${x - 18} ${y} q 9 -10 18 0 q 9 -10 18 0" stroke="#1a1430" stroke-width="4" fill="none"/>`;
  }
}

function phone() { // portrait: a night market street with neon
  grad('sky', [[0, '#0b0820'], [1, '#24113d']]);
  body += `<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  // buildings left/right in perspective
  body += `<path d="M 0 0 L ${W * 0.3} ${H * 0.35} L ${W * 0.3} ${H * 0.72} L 0 ${H} Z" fill="#160f28"/>`;
  body += `<path d="M ${W} 0 L ${W * 0.7} ${H * 0.35} L ${W * 0.7} ${H * 0.72} L ${W} ${H} Z" fill="#120c22"/>`;
  body += `<path d="M 0 ${H} L ${W * 0.3} ${H * 0.72} L ${W * 0.7} ${H * 0.72} L ${W} ${H} Z" fill="#0a0814"/>`;
  const neon = ['#ff3ea5', '#3ef0ff', '#ffd23e', '#7cff6b', '#b46bff'];
  for (let i = 0; i < 14; i++) {
    const left = i % 2 === 0, t = rnd();
    const x = left ? W * (0.02 + t * 0.22) : W * (0.76 + t * 0.2), y = H * (0.12 + rnd() * 0.6);
    const w = 60 + rnd() * 120, h = 26 + rnd() * 50, c = neon[i % neon.length];
    body += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="${c}" stroke-width="6" filter="url(#blur3)"/>`;
    body += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="${c}" stroke-width="2.5"/>`;
  }
  // lanterns string
  for (let i = 0; i < 9; i++) {
    const x = W * (0.12 + i * 0.1), y = H * (0.3 + Math.sin(i / 1.4) * 0.03);
    body += `<circle cx="${x}" cy="${y}" r="26" fill="#ff7a3e" opacity="0.4" filter="url(#blur8)"/><circle cx="${x}" cy="${y}" r="13" fill="#ffb36b"/>`;
  }
  // wet street reflections
  for (let i = 0; i < 12; i++) {
    const x = W * (0.32 + rnd() * 0.36), y = H * (0.76 + rnd() * 0.2);
    body += `<rect x="${x}" y="${y}" width="${4 + rnd() * 8}" height="${40 + rnd() * 120}" fill="${neon[i % neon.length]}" opacity="0.35" filter="url(#blur3)"/>`;
  }
}

function bars() { // the test pattern
  const cols = ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'];
  cols.forEach((c, i) => body += `<rect x="${(W * i) / 7}" y="0" width="${W / 7 + 1}" height="${H * 0.67}" fill="${c}"/>`);
  const low = ['#0000c0', '#131313', '#c000c0', '#131313', '#00c0c0', '#131313', '#c0c0c0'];
  low.forEach((c, i) => body += `<rect x="${(W * i) / 7}" y="${H * 0.67}" width="${W / 7 + 1}" height="${H * 0.08}" fill="${c}"/>`);
  body += `<rect y="${H * 0.75}" width="${W}" height="${H * 0.25}" fill="#101010"/>`;
  body += `<rect x="0" y="${H * 0.75}" width="${W * 0.18}" height="${H * 0.25}" fill="#00214c"/><rect x="${W * 0.18}" y="${H * 0.75}" width="${W * 0.18}" height="${H * 0.25}" fill="#ffffff"/><rect x="${W * 0.36}" y="${H * 0.75}" width="${W * 0.18}" height="${H * 0.25}" fill="#32006a"/>`;
}

({ city, mountain, sea, phone, bars })[scene]();
svg.innerHTML = `<defs>${defs}</defs>${body}`;
</script>
</body></html>
