# eirl-encoder image (MODEMS.md §12): usbmuxd holds the trust an iPhone's owner gave the encoder, which reaches far
# more of the phone than its tethering. Only root and usbmuxd itself may use it; none of the encoder's services does.
# - Its pairing records (the host's private keys) are written 0600: usbmuxd sets its folder back to 2775 itself.
# - Its socket is given to its own user (usbmux) and made 0600: usbmuxd chmods it to 0666 right after creating it
#   (hard-coded), so this waits for that 0666 and only then changes it. usbmuxd drops root for usbmux and opens its
#   session with the iPhone through its own socket: a root-owned socket means no session and no link. The owner
#   changes first, so usbmuxd never finds it closed. If the socket never shows up, the unit fails: closed, not open.
[Service]
UMask=0077
ExecStartPre=/bin/rm -f /run/usbmuxd
ExecStartPost=/bin/sh -c 'i=0; until [ "$$(stat -c %%a /run/usbmuxd 2>/dev/null)" = 666 ] || [ $$i -ge 300 ]; do sleep 0.01; i=$$((i+1)); done; chown usbmux /run/usbmuxd && chmod 0600 /run/usbmuxd'
