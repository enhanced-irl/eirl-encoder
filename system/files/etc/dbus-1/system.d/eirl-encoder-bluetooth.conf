<!-- /etc/dbus-1/system.d/eirl-encoder-bluetooth.conf: who may talk to BlueZ and BlueALSA (BLUETOOTH.md §3.7).
     Ubuntu 18.04's BlueZ only lets root (and the console and group lp) call org.bluez: the app and BlueALSA need their
     own holes. Each one only to the interfaces it uses (security review). BlueZ (root) calls back BlueALSA's endpoints
     and profiles and the app's agent through its own policy (bluetooth.conf). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- BlueALSA (eirl-bluealsa.service, its own user) owns its name and registers its endpoints and profiles with
       BlueZ (Media1, ProfileManager1), acquires the transports (MediaTransport1) and reads devices and adapters -->
  <policy user="bluealsa">
    <allow own_prefix="org.bluealsa"/>
    <allow send_destination="org.bluealsa"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Media1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.ProfileManager1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.MediaTransport1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.BatteryProviderManager1"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

  <!-- The engine (group audio) opens the PCMs through the ALSA plugin; never BlueALSA's RFCOMM channel -->
  <policy group="audio">
    <allow send_destination="org.bluealsa" send_interface="org.bluealsa.PCM1"/>
    <allow send_destination="org.bluealsa" send_interface="org.bluealsa.Manager1"/>
    <allow send_destination="org.bluealsa" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluealsa" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

  <!-- The app (eirl-encoderd): the adapter, searching, pairing through its agent, connecting, forgetting; and it
       reads BlueALSA's PCMs (it never opens them) -->
  <policy user="eirl-encoder">
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Device1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.AgentManager1"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bluealsa" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluealsa" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

</busconfig>
