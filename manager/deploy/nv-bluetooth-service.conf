# /etc/systemd/system/bluetooth.service.d/nv-bluetooth-service.conf (BLUETOOTH.md §3.7). Same name as NVIDIA's
# drop-in in /lib (package nvidia-l4t-firmware), so this one replaces it: NVIDIA's starts bluetoothd with debug
# logging and WITHOUT its audio plugins (--noplugin=audio,a2dp,avrcp), and without them BlueALSA cannot register
# A2DP. Here: bluetoothd with its audio plugins and WITHOUT the ones that are not audio (security review, D1): no HID
# (input, hog: a "keyboard" typing into the encoder), no networking (network), no SIM access (sap), no MIDI, no health.
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd --noplugin=input,hog,network,sap,midi,health
