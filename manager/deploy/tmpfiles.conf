# /etc/tmpfiles.d/eirl-encoder.conf — abre la LECTURA del consumo (ina3221 de la Jetson Nano) para
# eirl-encoderd. Por defecto solo lo lee root. Es telemetría de solo lectura.
z /sys/bus/i2c/drivers/ina3221x/6-0040/iio:device0/in_power*_input   0444 - - -
z /sys/bus/i2c/drivers/ina3221x/6-0040/iio:device0/in_voltage*_input 0444 - - -
z /sys/bus/i2c/drivers/ina3221x/6-0040/iio:device0/in_current*_input 0444 - - -
# Lista de enlaces a internet para SRTLA: la escribe el dispatcher de NetworkManager (root,
# 90-eirl-uplinks) and read by the engine and eirl-encoderd
d /run/eirl-uplinks 0755 root root -
# Punto de acceso de las cámaras de red: estado y concesiones del DHCP (eirl-netsetup, root; la app
# lo lee)
d /run/eirl-ap 0755 root root -
