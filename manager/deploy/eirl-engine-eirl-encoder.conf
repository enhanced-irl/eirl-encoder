# Drop-in for eirl-engine.service (→ /etc/systemd/system/eirl-engine.service.d/eirl-encoder.conf).
# The configuration eirl-encoderd manages (destination, bitrates, output) is NOT loaded as environment
# (EnvironmentFile): the engine reads it as data and only accepts its keys, so whoever can write that
# file cannot slip in BASH_ENV, LD_PRELOAD or paths. It overrides /etc/default.
[Service]
Environment=EIRL_CONF=/etc/eirl-encoder/engine.env
# To read it (0640, group eirl-encoder) without giving that group to the user outside the service.
# eirl-usbhub: cutting the power of a hung capture device's port (usbhub); only the engine has it
SupplementaryGroups=eirl-encoder eirl-usbhub
# The engine uses no sudo and nothing setuid: a bug in the engine cannot turn into root
NoNewPrivileges=yes
# Invalid configuration (the script exits with 64): do not restart every 2 s in a loop; it stays failed
# with "configuración no válida: <VAR>" in the journal, which the app shows.
RestartPreventExitStatus=64
